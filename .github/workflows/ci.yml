name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      INTERVIEW_EDIT_CI: "1"
      INTERVIEW_EDIT_TEST_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg fonts-noto-cjk
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.19"
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Test
        run: uv run pytest
      - name: Build
        if: matrix.python-version == '3.12'
        run: uv build
      - name: Smoke installed wheel
        if: matrix.python-version == '3.12'
        run: |
          uv venv .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/interview-edit --version
          .wheel-smoke/bin/interview-edit --help
          .wheel-smoke/bin/python -c 'import json, subprocess; p = subprocess.run([".wheel-smoke/bin/interview-edit", "doctor", "--json"], capture_output=True, text=True); assert p.returncode == 4, p.stdout + p.stderr; json.loads(p.stdout)'
      - name: Retain distribution packages
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: interview-edit-dist-python-${{ matrix.python-version }}
          path: dist/
          if-no-files-found: error

  native-platform-contracts:
    name: Native adapter contracts (${{ matrix.os }})
    env:
      INTERVIEW_EDIT_CI: "1"
      INTERVIEW_EDIT_TEST_FONT: ${{ matrix.os == 'windows-2022' && 'C:/Windows/Fonts/arial.ttf' || '/System/Library/Fonts/PingFang.ttc' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.19"
      - run: uv sync --locked --group dev
      - name: Install optional Windows driver dependencies (no client launch)
        if: runner.os == 'Windows'
        run: uv sync --locked --group dev --extra native-windows
      - name: Check installed optional SDK interfaces (no GUI)
        if: runner.os == 'Windows'
        run: uv run --extra native-windows python -c "import inspect, pyJianYingDraft as d; from pyJianYingDraft.jianying_controller import ControlFinder; assert callable(ControlFinder.desc_matcher); assert hasattr(d.JianyingController, 'get_window'); assert 'timeout' in inspect.signature(d.JianyingController.export_draft).parameters; assert d.ExportResolution.RES_1080P; assert d.ExportFramerate.FR_25"
      - name: Install Mac media tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install Windows media tools
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Platform paths, version API, safe copy and launcher contracts
        run: uv run pytest tests/unit/test_jianying_app.py tests/unit/test_verified_copy.py
      - name: Export, installation and output contracts (no native GUI)
        run: uv run pytest tests/integration/test_jianying_export.py tests/integration/test_jianying_integrity.py tests/integration/test_jianying_output.py
      - name: Editorial evidence and audio/caption pacing
        run: uv run pytest tests/unit/test_audio_edges.py tests/unit/test_caption_pacing.py tests/unit/test_review_phrases.py tests/integration/test_editorial_review.py
      - name: SDR source color contracts
        run: uv run pytest tests/unit/test_color_policy.py tests/integration/test_color_quality.py
      - name: Local editable motion source and alpha composition
        run: uv run pytest tests/unit/test_motion_spec.py tests/integration/test_motion_workflow.py
      - name: Native effects and export job contracts (simulated driver, no GUI)
        run: uv run pytest tests/unit/test_native_worker.py tests/integration/test_native_effects.py tests/integration/test_native_export_jobs.py
      - name: CLI import and command registration
        run: |
          uv run interview-edit jianying --help
          uv run interview-edit export jianying --help
          uv run interview-edit review --help
          uv run interview-edit motion --help
